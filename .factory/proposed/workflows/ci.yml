          commit="$(git rev-parse HEAD)"
          out="${RUNNER_TEMP}/e2e-bin"
          mkdir -p "$out"
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath \
            -ldflags "-X main.version=${VERSION} -X main.commit=${commit}" \
            -o "${out}/intuitik-windows-amd64.exe" ./cmd/intuitik
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -tags e2etest \
            -ldflags "-X main.version=${VERSION} -X main.commit=${commit}" \
            -o "${out}/intuitik-e2etest-windows-amd64.exe" ./cmd/intuitik
          sha256sum "${out}/intuitik-windows-amd64.exe" "${out}/intuitik-e2etest-windows-amd64.exe"

      - name: credexec-windows tests and list check
        shell: bash
        run: |
          set -uo pipefail
          export INTUITIK_E2E_BINARY="${RUNNER_TEMP}/e2e-bin/intuitik-windows-amd64.exe"
          export INTUITIK_E2E_TEST_BINARY="${RUNNER_TEMP}/e2e-bin/intuitik-e2etest-windows-amd64.exe"
          report="${RUNNER_TEMP}/credexec-windows.json"
          test_code=0
          go test -count=1 -json -run "^($(grep -E '^Test' internal/kube/credexec/REQUIRED_TESTS_WINDOWS | tr -d '\r' | paste -sd'|' -))$" ./internal/kube/... ./cmd/intuitik/... > "$report" || test_code=$?
          list_code=0
          python - internal/kube/credexec/REQUIRED_TESTS_WINDOWS "$report" <<'PY' || list_code=$?
          import json, sys
          list_path, report_path = sys.argv[1], sys.argv[2]
          names = [l.strip() for l in open(list_path, encoding="utf-8") if l.strip() and not l.strip().startswith("#")]
          seen = {}
          for line in open(report_path, encoding="utf-8"):
              if not line.startswith("{"):
                  print(line, end="")
                  continue
              event = json.loads(line)
              if event.get("Action") == "output":
                  print(event.get("Output", ""), end="")
              if event.get("Test") and event.get("Action") in ("pass", "fail", "skip"):
                  seen.setdefault(event["Test"], []).append(event["Action"])
          bad = 0
          if not names:
              print("list check: the list is empty")
              bad = 1
          if len(set(names)) != len(names):
              print("list check: the list names a test more than once")
              bad = 1
          for name in names:
              results = seen.get(name, [])
              result = "missing" if not results else "pass" if all(r == "pass" for r in results) else ",".join(sorted(set(results)))
              print(f"list check: {name} {result}")
              if result != "pass":
                  bad = 1
          print(f"list check: {len(names)} listed, {'pass' if bad == 0 else 'fail'}")
          sys.exit(bad)
          PY
          echo "go test exit=${test_code} list check exit=${list_code}"
          if [ "$test_code" -ne 0 ] || [ "$list_code" -ne 0 ]; then
            exit 1
          fi

  # Graph containment tests in kind (packet FA2-T5 sections 6 and 7, D.6) on the release binary.
  # The job runs its own kind cluster from test/e2e-api/graph/kind-config.yaml: garbage collector
  # controller off, so that a child with a dangling owner reference stays for the request, and an
  # API server audit log at Metadata level for the read-only check G7. The list check fails unless
  # every test of test/e2e-api/graph/REQUIRED_TESTS_KIND ran and passed.
  e2e-graph:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          package-manager-cache: false

      - name: Frontend build
        working-directory: web
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Build product binary
        env:
          VERSION: 0.0.0-dev
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          out="${RUNNER_TEMP}/e2e-bin"
          mkdir -p "$out"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-X main.version=${VERSION} -X main.commit=${commit}" \
            -o "${out}/intuitik-linux-amd64" ./cmd/intuitik
          sha256sum "${out}/intuitik-linux-amd64"

      # kind and kubectl are checked against the sha256 values below before use; a mismatch
      # fails the job. kind: the GitHub release asset digest; kubectl: the value at dl.k8s.io.
      - name: Install kind and kubectl
        env:
          KIND_VERSION: v0.33.0
          KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
          KUBECTL_VERSION: v1.37.0
          KUBECTL_SHA256: 6129359f4e1f3848a5572ccb0b26cf28b8ca08cef38c95a765b2f64a2c961a2f
        run: |
          set -euo pipefail
          bin="${RUNNER_TEMP}/kind-bin"
          mkdir -p "$bin"
          curl -fsSL -o "${bin}/kind" \
            "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  ${bin}/kind" | sha256sum -c -
          curl -fsSL -o "${bin}/kubectl" \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  ${bin}/kubectl" | sha256sum -c -
          chmod +x "${bin}/kind" "${bin}/kubectl"
          echo "$bin" >> "${GITHUB_PATH}"
          "${bin}/kind" version
          "${bin}/kubectl" version --client

      # Contract with test/e2e-api/graph/kind-config.yaml: the host directory in GRAPH_AUDIT_DIR
      # holds the audit policy written here (audit-policy.yaml), the config mounts it into the node,
      # and the API server writes its audit log inside the node at the path in GRAPH_AUDIT_LOG.
      # The step fails unless the controller manager's --controllers list holds -garbagecollector
      # and the audit log exists and is not empty. The tests receive the kubeconfig path in
      # INTUITIK_E2E_KIND_KUBECONFIG, the node container in INTUITIK_E2E_GRAPH_NODE and the audit
      # log path inside that node in INTUITIK_E2E_GRAPH_AUDIT_LOG.
      - name: Create graph kind cluster
        env:
          KIND_NODE_IMAGE: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
          GRAPH_AUDIT_DIR: /tmp/intuitik-graph-audit
          GRAPH_AUDIT_LOG: /var/log/kubernetes/audit/audit.log
          GRAPH_NODE: intuitik-graph-control-plane
        run: |
          set -euo pipefail
          mkdir -p "$GRAPH_AUDIT_DIR"
          printf '%s\n' 'apiVersion: audit.k8s.io/v1' 'kind: Policy' 'rules:' '  - level: Metadata' \
            > "${GRAPH_AUDIT_DIR}/audit-policy.yaml"
          cat "${GRAPH_AUDIT_DIR}/audit-policy.yaml"
          sha256sum "${GRAPH_AUDIT_DIR}/audit-policy.yaml" test/e2e-api/graph/kind-config.yaml
          kubeconfig="${RUNNER_TEMP}/kind-graph/kubeconfig"
          mkdir -p "$(dirname "$kubeconfig")"
          echo "kind node image: ${KIND_NODE_IMAGE}"
          kind create cluster --name intuitik-graph --image "$KIND_NODE_IMAGE" \
            --config test/e2e-api/graph/kind-config.yaml \
            --kubeconfig "$kubeconfig" --wait 180s
          if [ -e "${HOME}/.kube/config" ]; then
            echo "kind kubeconfig: ${HOME}/.kube/config exists"
            exit 1
          fi
          echo "kind kubeconfig: ${kubeconfig}; ${HOME}/.kube/config absent"
          echo "KUBECONFIG=${kubeconfig}" >> "${GITHUB_ENV}"
          echo "INTUITIK_E2E_KIND_KUBECONFIG=${kubeconfig}" >> "${GITHUB_ENV}"
          echo "INTUITIK_E2E_GRAPH_NODE=${GRAPH_NODE}" >> "${GITHUB_ENV}"
          echo "INTUITIK_E2E_GRAPH_AUDIT_LOG=${GRAPH_AUDIT_LOG}" >> "${GITHUB_ENV}"
          KUBECONFIG="$kubeconfig" kubectl version
          KUBECONFIG="$kubeconfig" kubectl get nodes -o wide
          controllers="$(KUBECONFIG="$kubeconfig" kubectl -n kube-system get pods \
            -l component=kube-controller-manager -o json \
            | jq -r '[.items[].spec.containers[].command[] | select(startswith("--controllers="))] | join(" ")')"
          echo "kube-controller-manager controllers flag: [${controllers}]"
          case ",${controllers#--controllers=}," in
            *,-garbagecollector,*) echo "garbage collector controller: off" ;;
            *) echo "garbage collector controller: not off"; exit 1 ;;
          esac
          audit_lines="$(docker exec "$GRAPH_NODE" sh -c 'test -s "$1" && wc -l < "$1"' sh "$GRAPH_AUDIT_LOG")" \
            || { echo "audit log: ${GRAPH_AUDIT_LOG} missing or empty in ${GRAPH_NODE}"; exit 1; }
          echo "audit log: ${GRAPH_AUDIT_LOG} in ${GRAPH_NODE}, ${audit_lines} lines"

      # The -run pattern is built from the list file, so this job runs exactly the listed tests.
      # go test and the list check run in one step, so that the list check also prints its
      # result when tests fail; the step exits non-zero if either of them failed.
      - name: e2e-graph tests and list check
        run: |
          set -uo pipefail
          export INTUITIK_E2E_BINARY="${RUNNER_TEMP}/e2e-bin/intuitik-linux-amd64"
          report="${RUNNER_TEMP}/e2e-graph.json"
          test_code=0
          go test -tags kind -json -run "^($(paste -sd'|' test/e2e-api/graph/REQUIRED_TESTS_KIND))$" ./test/e2e-api/graph/... > "$report" || test_code=$?
          list_code=0
          python3 - test/e2e-api/graph/REQUIRED_TESTS_KIND "$report" <<'PY' || list_code=$?
          import json, sys
          list_path, report_path = sys.argv[1], sys.argv[2]
          names = [l.strip() for l in open(list_path, encoding="utf-8") if l.strip() and not l.strip().startswith("#")]
          seen = {}
          for line in open(report_path, encoding="utf-8"):
              if not line.startswith("{"):
                  print(line, end="")
                  continue
              event = json.loads(line)
              if event.get("Action") == "output":
                  print(event.get("Output", ""), end="")
              if event.get("Test") and event.get("Action") in ("pass", "fail", "skip"):
                  seen.setdefault(event["Test"], []).append(event["Action"])
          bad = 0
          if not names:
              print("list check: the list is empty")
              bad = 1
          if len(set(names)) != len(names):
              print("list check: the list names a test more than once")
              bad = 1
          for name in names:
              results = seen.get(name, [])
              result = "missing" if not results else "pass" if all(r == "pass" for r in results) else ",".join(sorted(set(results)))
              print(f"list check: {name} {result}")
              if result != "pass":
                  bad = 1
          print(f"list check: {len(names)} listed, {'pass' if bad == 0 else 'fail'}")
          sys.exit(bad)
          PY
          echo "go test exit=${test_code} list check exit=${list_code}"
          if [ "$test_code" -ne 0 ] || [ "$list_code" -ne 0 ]; then
            exit 1
          fi

      # Runs after a failed step too, so that the cluster is deleted at the end of every job.
      - name: Delete graph kind cluster
        if: always()
        run: |
          set -euo pipefail
          kubeconfig="${RUNNER_TEMP}/kind-graph/kubeconfig"
          if command -v kind > /dev/null; then
            kind delete cluster --name intuitik-graph --kubeconfig "$kubeconfig"
          fi
          echo "kind clusters after delete: [$(kind get clusters 2>/dev/null | tr '\n' ' ')]"

  # Appendix A scenarios and the H-K2 judge in kind (packet FA2-T7b sections 6.6 and 7) on the
  # release binary. The job runs its own kind cluster with kind's default configuration (no config
  # file: garbage collector on, no audit log), so that the healthy baseline A-0 counts broken bridges
  # over every namespace of a cluster that holds no other ticket's fixtures. The tests apply the
  # manifests of scenarios/appendix-a themselves; this job applies nothing. The list check fails
  # unless every test of test/e2e-api/appendix-a/REQUIRED_TESTS_KIND ran and passed.
  appendix-a:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          package-manager-cache: false

      - name: Frontend build
        working-directory: web
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Build product binary
        env:
          VERSION: 0.0.0-dev
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          out="${RUNNER_TEMP}/e2e-bin"
          mkdir -p "$out"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-X main.version=${VERSION} -X main.commit=${commit}" \
            -o "${out}/intuitik-linux-amd64" ./cmd/intuitik
          sha256sum "${out}/intuitik-linux-amd64"

      # kind and kubectl are checked against the sha256 values below before use; a mismatch
      # fails the job. kind: the GitHub release asset digest; kubectl: the value at dl.k8s.io.
      - name: Install kind and kubectl
        env:
          KIND_VERSION: v0.33.0
          KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
          KUBECTL_VERSION: v1.37.0
          KUBECTL_SHA256: 6129359f4e1f3848a5572ccb0b26cf28b8ca08cef38c95a765b2f64a2c961a2f
        run: |
          set -euo pipefail
          bin="${RUNNER_TEMP}/kind-bin"
          mkdir -p "$bin"
          curl -fsSL -o "${bin}/kind" \
            "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  ${bin}/kind" | sha256sum -c -
          curl -fsSL -o "${bin}/kubectl" \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  ${bin}/kubectl" | sha256sum -c -
          chmod +x "${bin}/kind" "${bin}/kubectl"
          echo "$bin" >> "${GITHUB_PATH}"
          "${bin}/kind" version
          "${bin}/kubectl" version --client

      # kind's default configuration (no --config). The tests receive the kubeconfig path in
      # INTUITIK_E2E_KIND_KUBECONFIG and KUBECONFIG; an existing ~/.kube/config fails the step.
      # The StorageClass list is printed for the record; the tests check the default class.
      - name: Create appendix-a kind cluster
        env:
          KIND_NODE_IMAGE: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
        run: |
          set -euo pipefail
          kubeconfig="${RUNNER_TEMP}/kind-appendix/kubeconfig"
          mkdir -p "$(dirname "$kubeconfig")"
          echo "kind node image: ${KIND_NODE_IMAGE}"
          kind create cluster --name intuitik-appendix --image "$KIND_NODE_IMAGE" \
            --kubeconfig "$kubeconfig" --wait 180s
          if [ -e "${HOME}/.kube/config" ]; then
            echo "kind kubeconfig: ${HOME}/.kube/config exists"
            exit 1
          fi
          echo "kind kubeconfig: ${kubeconfig}; ${HOME}/.kube/config absent"
          echo "KUBECONFIG=${kubeconfig}" >> "${GITHUB_ENV}"
          echo "INTUITIK_E2E_KIND_KUBECONFIG=${kubeconfig}" >> "${GITHUB_ENV}"
          KUBECONFIG="$kubeconfig" kubectl version
          KUBECONFIG="$kubeconfig" kubectl get nodes -o wide
          KUBECONFIG="$kubeconfig" kubectl get storageclass

      # The -run pattern is built from the list file, so this job runs exactly the listed tests.
      # go test and the list check run in one step, so that the list check also prints its
      # result when tests fail; the step exits non-zero if either of them failed.
      - name: appendix-a tests and list check
        run: |
          set -uo pipefail
          export INTUITIK_E2E_BINARY="${RUNNER_TEMP}/e2e-bin/intuitik-linux-amd64"
          report="${RUNNER_TEMP}/appendix-a.json"
          test_code=0
          go test -tags kind -json -timeout 20m -run "^($(paste -sd'|' test/e2e-api/appendix-a/REQUIRED_TESTS_KIND))$" ./test/e2e-api/appendix-a/... > "$report" || test_code=$?
          list_code=0
          python3 - test/e2e-api/appendix-a/REQUIRED_TESTS_KIND "$report" <<'PY' || list_code=$?
          import json, sys
          list_path, report_path = sys.argv[1], sys.argv[2]
          names = [l.strip() for l in open(list_path, encoding="utf-8") if l.strip() and not l.strip().startswith("#")]
          seen = {}
          for line in open(report_path, encoding="utf-8"):
              if not line.startswith("{"):
                  print(line, end="")
                  continue
              event = json.loads(line)
              if event.get("Action") == "output":
                  print(event.get("Output", ""), end="")
              if event.get("Test") and event.get("Action") in ("pass", "fail", "skip"):
                  seen.setdefault(event["Test"], []).append(event["Action"])
          bad = 0
          if not names:
              print("list check: the list is empty")
              bad = 1
          if len(set(names)) != len(names):
              print("list check: the list names a test more than once")
              bad = 1
          for name in names:
              results = seen.get(name, [])
              result = "missing" if not results else "pass" if all(r == "pass" for r in results) else ",".join(sorted(set(results)))
              print(f"list check: {name} {result}")
              if result != "pass":
                  bad = 1
          print(f"list check: {len(names)} listed, {'pass' if bad == 0 else 'fail'}")
          sys.exit(bad)
          PY
          echo "go test exit=${test_code} list check exit=${list_code}"
          if [ "$test_code" -ne 0 ] || [ "$list_code" -ne 0 ]; then
            exit 1
          fi

      # Runs after a failed step too, so that the cluster is deleted at the end of every job.
      - name: Delete appendix-a kind cluster
        if: always()
        run: |
          set -euo pipefail
          kubeconfig="${RUNNER_TEMP}/kind-appendix/kubeconfig"
          if command -v kind > /dev/null; then
            kind delete cluster --name intuitik-appendix --kubeconfig "$kubeconfig"
          fi
          echo "kind clusters after delete: [$(kind get clusters 2>/dev/null | tr '\n' ' ')]"

  # Performance harness of the server (packet FA2-T12 sections 6 and 7) on the release binary.
  # TestPerfServer builds its own kind cluster from test/perf/server (config and audit policy),
  # runs kwok out of cluster for the fake nodes, measures the binary and calls tools/perfjudge.
  # pull_request: scale S once. workflow_dispatch: scale L (5 runs), the L graph file upload,
  # then scale XL. The job prints HEAD, the binary sha256, the blob of this workflow file,
  # free -m and the elapsed seconds of each phase. The list check fails unless every test of
  # test/perf/server/REQUIRED_TESTS_KIND ran and passed, at each scale.
  perf-server:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 120 || 30 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Print perf context
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_SHA: ${{ github.sha }}
          RUN_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          echo "PERF-CONTEXT event=${EVENT_NAME} ref=${RUN_REF} github_sha=${RUN_SHA} head=$(git rev-parse HEAD) workflow_blob=$(git hash-object .github/workflows/ci.yml)"
          nproc
          free -m

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          package-manager-cache: false

      - name: Frontend build
        working-directory: web
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Build product binary
        env:
          VERSION: 0.0.0-dev
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          out="${RUNNER_TEMP}/e2e-bin"
          mkdir -p "$out"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-X main.version=${VERSION} -X main.commit=${commit}" \
            -o "${out}/intuitik-linux-amd64" ./cmd/intuitik
          echo "PERF-BINARY head=${commit} sha256=$(sha256sum "${out}/intuitik-linux-amd64" | cut -d' ' -f1)"
          echo "PERF-PHASE build elapsed_s=${SECONDS}"
          free -m

      # kind, kubectl, kwok and the kwok stage file are checked against the sha256 values below
      # before use; a mismatch fails the job. kind, kwok and stage-fast.yaml: the GitHub release
      # asset digests; kubectl: the value at dl.k8s.io. No kwok image is pulled.
      - name: Install kind, kubectl and kwok
        env:
          KIND_VERSION: v0.33.0
          KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
          KUBECTL_VERSION: v1.37.0
          KUBECTL_SHA256: 6129359f4e1f3848a5572ccb0b26cf28b8ca08cef38c95a765b2f64a2c961a2f
          KWOK_VERSION: v0.8.0
          KWOK_SHA256: f5a4385a2ae1b9dd7f8acae18e002a75c0ebba124ae9d7259aa8dadb50711f46
          KWOK_STAGES_SHA256: 2f28d95564ec43056c0873f7a25ac7d2a5bba4c8496c72f8b3ee73fd4f54ee24
        run: |
          set -euo pipefail
          bin="${RUNNER_TEMP}/kind-bin"
          mkdir -p "$bin" "${RUNNER_TEMP}/kwok"
          curl -fsSL -o "${bin}/kind" \
            "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  ${bin}/kind" | sha256sum -c -
          curl -fsSL -o "${bin}/kubectl" \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  ${bin}/kubectl" | sha256sum -c -
          curl -fsSL -o "${bin}/kwok" \
            "https://github.com/kubernetes-sigs/kwok/releases/download/${KWOK_VERSION}/kwok-linux-amd64"
          echo "${KWOK_SHA256}  ${bin}/kwok" | sha256sum -c -
          curl -fsSL -o "${RUNNER_TEMP}/kwok/stage-fast.yaml" \
            "https://github.com/kubernetes-sigs/kwok/releases/download/${KWOK_VERSION}/stage-fast.yaml"
          echo "${KWOK_STAGES_SHA256}  ${RUNNER_TEMP}/kwok/stage-fast.yaml" | sha256sum -c -
          chmod +x "${bin}/kind" "${bin}/kubectl" "${bin}/kwok"
          echo "$bin" >> "${GITHUB_PATH}"
          "${bin}/kind" version
          "${bin}/kubectl" version --client

      # The test receives the binary, the scale, the kind node image, the kwok binary and stage
      # file, a work directory for the cluster, the audit log and the cause records, and the
      # output directory of the L graph file. The -run pattern is built from the list file, so
      # this step runs exactly the listed tests. go test and the list check run in one step, so
      # that the list check also prints its result when tests fail; the step exits non-zero if
      # either of them failed.
      - name: perf-server tests and list check
        env:
          INTUITIK_PERF_SCALE: ${{ github.event_name == 'workflow_dispatch' && 'L' || 'S' }}
          GO_TEST_TIMEOUT: ${{ github.event_name == 'workflow_dispatch' && '95m' || '25m' }}
        run: |
          set -uo pipefail
          export INTUITIK_E2E_BINARY="${RUNNER_TEMP}/e2e-bin/intuitik-linux-amd64"
          export INTUITIK_PERF_KIND_IMAGE="kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5"
          export INTUITIK_PERF_KWOK="${RUNNER_TEMP}/kind-bin/kwok"
          export INTUITIK_PERF_KWOK_STAGES="${RUNNER_TEMP}/kwok/stage-fast.yaml"
          export INTUITIK_PERF_WORK="${RUNNER_TEMP}/perf-work-${INTUITIK_PERF_SCALE}"
          export INTUITIK_PERF_OUT="${RUNNER_TEMP}/perf-out"
          mkdir -p "$INTUITIK_PERF_WORK" "$INTUITIK_PERF_OUT"
          echo "PERF-PHASE scale=${INTUITIK_PERF_SCALE} start elapsed_s=${SECONDS}"
          free -m
          report="${RUNNER_TEMP}/perf-server-${INTUITIK_PERF_SCALE}.json"
          test_code=0
          go test -tags kind -json -timeout "$GO_TEST_TIMEOUT" -run "^($(paste -sd'|' test/perf/server/REQUIRED_TESTS_KIND))$" ./test/perf/server/... > "$report" || test_code=$?
          list_code=0
          python3 - test/perf/server/REQUIRED_TESTS_KIND "$report" <<'PY' || list_code=$?
          import json, sys
          list_path, report_path = sys.argv[1], sys.argv[2]
          names = [l.strip() for l in open(list_path, encoding="utf-8") if l.strip() and not l.strip().startswith("#")]
          seen = {}
          for line in open(report_path, encoding="utf-8"):
              if not line.startswith("{"):
                  print(line, end="")
                  continue
              event = json.loads(line)
              if event.get("Action") == "output":
                  print(event.get("Output", ""), end="")
              if event.get("Test") and event.get("Action") in ("pass", "fail", "skip"):
                  seen.setdefault(event["Test"], []).append(event["Action"])
          bad = 0
          if not names:
              print("list check: the list is empty")
              bad = 1
          if len(set(names)) != len(names):
              print("list check: the list names a test more than once")
              bad = 1
          for name in names:
              results = seen.get(name, [])
              result = "missing" if not results else "pass" if all(r == "pass" for r in results) else ",".join(sorted(set(results)))
              print(f"list check: {name} {result}")
              if result != "pass":
                  bad = 1
          print(f"list check: {len(names)} listed, {'pass' if bad == 0 else 'fail'}")
          sys.exit(bad)
          PY
          echo "PERF-PHASE scale=${INTUITIK_PERF_SCALE} end elapsed_s=${SECONDS}"
          free -m
          echo "go test exit=${test_code} list check exit=${list_code}"
          if [ "$test_code" -ne 0 ] || [ "$list_code" -ne 0 ]; then
            exit 1
          fi

      # Dispatch only. The byte count and sha256 are printed before the upload; a file above
      # 50,000,000 bytes or a missing file fails this step, so nothing is uploaded.
      - name: Check L graph file
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          file="${RUNNER_TEMP}/perf-out/l-graph.tar.gz"
          if [ ! -f "$file" ]; then
            echo "L graph file: ${file} missing"
            exit 1
          fi
          bytes="$(stat -c %s "$file")"
          echo "PERF-ARTIFACT l-graph.tar.gz bytes=${bytes} sha256=$(sha256sum "$file" | cut -d' ' -f1) limit=50000000"
          if [ "$bytes" -gt 50000000 ]; then
            echo "L graph file: ${bytes} bytes is above 50000000, not uploaded"
            exit 1
          fi

      - name: Upload L graph file
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: l-graph
          path: ${{ runner.temp }}/perf-out/l-graph.tar.gz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: false

      - name: perf-server XL tests and list check
        if: github.event_name == 'workflow_dispatch'
        env:
          INTUITIK_PERF_SCALE: XL
          GO_TEST_TIMEOUT: 60m
        run: |
          set -uo pipefail
          export INTUITIK_E2E_BINARY="${RUNNER_TEMP}/e2e-bin/intuitik-linux-amd64"
          export INTUITIK_PERF_KIND_IMAGE="kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5"
          export INTUITIK_PERF_KWOK="${RUNNER_TEMP}/kind-bin/kwok"
          export INTUITIK_PERF_KWOK_STAGES="${RUNNER_TEMP}/kwok/stage-fast.yaml"
          export INTUITIK_PERF_WORK="${RUNNER_TEMP}/perf-work-${INTUITIK_PERF_SCALE}"
          export INTUITIK_PERF_OUT="${RUNNER_TEMP}/perf-out"
          mkdir -p "$INTUITIK_PERF_WORK" "$INTUITIK_PERF_OUT"
          echo "PERF-PHASE scale=${INTUITIK_PERF_SCALE} start elapsed_s=${SECONDS}"
          free -m
          report="${RUNNER_TEMP}/perf-server-${INTUITIK_PERF_SCALE}.json"
          test_code=0
          go test -tags kind -json -timeout "$GO_TEST_TIMEOUT" -run "^($(paste -sd'|' test/perf/server/REQUIRED_TESTS_KIND))$" ./test/perf/server/... > "$report" || test_code=$?
          list_code=0
          python3 - test/perf/server/REQUIRED_TESTS_KIND "$report" <<'PY' || list_code=$?
          import json, sys
          list_path, report_path = sys.argv[1], sys.argv[2]
          names = [l.strip() for l in open(list_path, encoding="utf-8") if l.strip() and not l.strip().startswith("#")]
          seen = {}
          for line in open(report_path, encoding="utf-8"):
              if not line.startswith("{"):
                  print(line, end="")
                  continue
              event = json.loads(line)
              if event.get("Action") == "output":
                  print(event.get("Output", ""), end="")
              if event.get("Test") and event.get("Action") in ("pass", "fail", "skip"):
                  seen.setdefault(event["Test"], []).append(event["Action"])
          bad = 0
          if not names:
              print("list check: the list is empty")
              bad = 1
          if len(set(names)) != len(names):
              print("list check: the list names a test more than once")
              bad = 1
          for name in names:
              results = seen.get(name, [])
              result = "missing" if not results else "pass" if all(r == "pass" for r in results) else ",".join(sorted(set(results)))
              print(f"list check: {name} {result}")
              if result != "pass":
                  bad = 1
          print(f"list check: {len(names)} listed, {'pass' if bad == 0 else 'fail'}")
          sys.exit(bad)
          PY
          echo "PERF-PHASE scale=${INTUITIK_PERF_SCALE} end elapsed_s=${SECONDS}"
          free -m
          echo "go test exit=${test_code} list check exit=${list_code}"
          if [ "$test_code" -ne 0 ] || [ "$list_code" -ne 0 ]; then
            exit 1
          fi

      # Runs after a failed step too, so that every kind cluster of this job is deleted at the end.
      - name: Delete perf kind clusters
        if: always()
        run: |
          set -euo pipefail
          if command -v kind > /dev/null; then
            for name in $(kind get clusters 2>/dev/null); do
              kind delete cluster --name "$name"
            done
          fi
          echo "kind clusters after delete: [$(kind get clusters 2>/dev/null | tr '\n' ' ')]"

  # Clickable prototype of the relation map (packet FA2-T8): fixed tables, product build marker
  # check, prototype build, the Playwright cases of web/prototype/e2e/REQUIRED_TESTS (project
  # chromium), the evidence pack, and its guarded upload. Only agent/FA2-T8 with the marker file
  # web/prototype/e2e/UPLOAD uploads, on attempt 1, one job of the group at a time, and only while
  # the repository's listed and reserved artifact bytes stay at or under 300,000,000.
  prototype:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: prototype-upload
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The three fixed tables of the packet, checked against web/prototype/e2e/fixed.sha256,
      # whose own sha256 is the delivery's value. Runs first and again right before the tests.
      - name: Fixed tables
        env:
          FIXED_SHA256: f279fc6a1758218a6df044e52564e62876b06cc2259166a14a035db3dcd50a05
        run: |
          set -euo pipefail
          list="web/prototype/e2e/fixed.sha256"
          if [ ! -f "$list" ]; then
            echo "FAIL fixed tables: ${list} missing"
            exit 1
          fi
          got="$(sha256sum "$list" | cut -d' ' -f1)"
          echo "fixed tables: ${list} sha256=${got} expected=${FIXED_SHA256}"
          if [ "$got" != "$FIXED_SHA256" ]; then
            echo "FAIL fixed tables: ${list} sha256 differs"
            exit 1
          fi
          code=0
          sha256sum -c "$list" || code=$?
          if [ "$code" -ne 0 ]; then
            echo "FAIL fixed tables: a table differs from ${list}"
            exit 1
          fi
          echo "fixed tables: PASS"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          package-manager-cache: false

      - name: npm ci
        working-directory: web
        run: |
          set -euo pipefail
          npm ci --ignore-scripts

      # As in build: Node must equal web/.nvmrc and npm the npm field of that Node version.
      - name: Toolchain versions
        run: |
          set -euo pipefail
          go run ./tools/verifymap/toolchain -nvmrc web/.nvmrc

      - name: Install Playwright browser
        working-directory: web
        run: |
          set -euo pipefail
          npx playwright --version
          npx playwright install --with-deps chromium

      # The product build must hold no prototype marker (packet 6.3); this is a check of built files.
      - name: Product build and marker check
        working-directory: web
        run: |
          set -euo pipefail
          npm run build
          out="../cmd/intuitik/dist"
          hits="$(grep -r -l -E 'data-prototype|INTUITIK-CANARY|@xyflow|sigma|graphology|dagre' "$out" || true)"
          if [ -n "$hits" ]; then
            echo "FAIL product build: prototype marker in"
            echo "$hits"
            exit 1
          fi
          echo "product build: no prototype marker in ${out}"

      - name: Prototype build
        working-directory: web
        run: |
          set -euo pipefail
          npx vite build --config prototype/vite.config.js
          find prototype/dist -type f | sort

      - name: Fixed-table check
        env:
          FIXED_SHA256: f279fc6a1758218a6df044e52564e62876b06cc2259166a14a035db3dcd50a05
        run: |
          set -euo pipefail
          list="web/prototype/e2e/fixed.sha256"
          if [ ! -f "$list" ]; then
            echo "FAIL fixed tables: ${list} missing"
            exit 1
          fi
          got="$(sha256sum "$list" | cut -d' ' -f1)"
          echo "fixed tables: ${list} sha256=${got} expected=${FIXED_SHA256}"
          if [ "$got" != "$FIXED_SHA256" ]; then
            echo "FAIL fixed tables: ${list} sha256 differs"
            exit 1
          fi
          code=0
          sha256sum -c "$list" || code=$?
          if [ "$code" -ne 0 ]; then
            echo "FAIL fixed tables: a table differs from ${list}"
            exit 1
          fi
          echo "fixed tables: PASS"

      # Playwright reads web/prototype/e2e/playwright.config.js (project chromium, retries 0). The
      # cases write captures, DOM dumps and measurement output to INTUITIK_PROTO_OUT; the list
      # check fails unless every case of web/prototype/e2e/REQUIRED_TESTS passed.
      - name: prototype tests and list check
        working-directory: web
        run: |
          set -uo pipefail
          export INTUITIK_PROTO_OUT="${RUNNER_TEMP}/prototype-out"
          mkdir -p "$INTUITIK_PROTO_OUT"
          report="${RUNNER_TEMP}/prototype.json"
          log="${RUNNER_TEMP}/prototype-playwright.log"
          PLAYWRIGHT_JSON_OUTPUT_NAME="$report" npx playwright test --config=prototype/e2e/playwright.config.js --reporter=list,json 2>&1 | tee "$log"
          test_code="${PIPESTATUS[0]}"
          list_code=0
          python3 - prototype/e2e/REQUIRED_TESTS "$report" <<'PY' || list_code=$?
          import json, sys
          list_path, report_path = sys.argv[1], sys.argv[2]
          projects = ["chromium"]
          names = [l.strip() for l in open(list_path, encoding="utf-8") if l.strip() and not l.strip().startswith("#")]
          with open(report_path, encoding="utf-8") as f:
              data = json.load(f)
          bad = 0
          configured = {p.get("name"): p.get("retries") for p in data.get("config", {}).get("projects", [])}
          print(f"list check: projects {sorted(configured)} retries {[configured[n] for n in sorted(configured)]}")
          if sorted(configured) != projects or any(r != 0 for r in configured.values()):
              print("list check: the projects must be exactly chromium, with retries 0")
              bad = 1
          seen = {}
          # A case name is its describe titles and its test title joined with "/"; the file suite is left out.
          def walk(suite, path):
              for child in suite.get("suites") or []:
                  walk(child, path + [child["title"]])
              for spec in suite.get("specs") or []:
                  name = "/".join(path + [spec["title"]])
                  for test in spec.get("tests") or []:
                      statuses = [r.get("status") for r in test.get("results") or []]
                      seen.setdefault((name, test.get("projectName")), []).extend(statuses or ["missing"])
          for file_suite in data.get("suites") or []:
              walk(file_suite, [])
          if not names:
              print("list check: the list is empty")
              bad = 1
          if len(set(names)) != len(names):
              print("list check: the list names a case more than once")
              bad = 1
          for name in names:
              for project in projects:
                  statuses = seen.get((name, project), [])
                  result = "missing" if not statuses else "passed" if all(s == "passed" for s in statuses) else ",".join(sorted(set(map(str, statuses))))
                  print(f"list check: {name} [{project}] {result}")
                  if result != "passed":
                      bad = 1
          print(f"list check: {len(names)} listed x {len(projects)} projects, {'pass' if bad == 0 else 'fail'}")
          sys.exit(bad)
          PY
          echo "playwright exit=${test_code} list check exit=${list_code}"
          if [ "$test_code" -ne 0 ] || [ "$list_code" -ne 0 ]; then
            exit 1
          fi

      # The pack (test output, the prototype dist, the Playwright log) is made reproducibly; its
      # byte count and sha256 are printed before any upload.
      - name: Evidence pack
        run: |
          set -euo pipefail
          stage="${RUNNER_TEMP}/prototype-evidence"
          rm -rf "$stage"
          mkdir -p "$stage"
          cp -R "${RUNNER_TEMP}/prototype-out" "$stage/out"
          cp -R web/prototype/dist "$stage/dist"
          cp "${RUNNER_TEMP}/prototype-playwright.log" "$stage/playwright.log"
          pack="${RUNNER_TEMP}/prototype-evidence.tar.gz"
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -C "$stage" -cf - . | gzip -n > "$pack"
          echo "PROTO-PACK prototype-evidence.tar.gz bytes=$(stat -c %s "$pack") sha256=$(sha256sum "$pack" | cut -d' ' -f1) limit=20000000"

      # Upload guard (packet FA2-T8 section 7). It reads the GitHub API without a token. No upload
      # unless every condition holds; a skip prints "upload skipped", a refusal prints
      # "upload refused reason=<...>" and fails the job. It deletes nothing.
      - name: Upload guard
        id: guard
        env:
          HEAD_REF: ${{ github.head_ref }}
          PACK: ${{ runner.temp }}/prototype-evidence.tar.gz
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import json, os, subprocess, sys, urllib.error, urllib.parse, urllib.request

          API = os.environ.get("GITHUB_API_URL", "https://api.github.com").rstrip("/")
          REPO = os.environ["GITHUB_REPOSITORY"]
          RUN_ID = int(os.environ["GITHUB_RUN_ID"])
          RUN_NUMBER = int(os.environ["GITHUB_RUN_NUMBER"])
          ATTEMPT = int(os.environ["GITHUB_RUN_ATTEMPT"])
          HEAD_REF = os.environ.get("HEAD_REF", "")
          PACK = os.environ["PACK"]
          BRANCH = "agent/FA2-T8"
          MARKER = "web/prototype/e2e/UPLOAD"
          PACK_LIMIT = 20000000
          RESERVE = 20000000
          LIMIT = 300000000

          def skip(text):
              print(f"upload skipped {text}")
              sys.exit(0)

          def refuse(reason):
              print(f"upload refused reason={reason}")
              sys.exit(1)

          def get(path, query):
              url = f"{API}{path}?{urllib.parse.urlencode(query)}"
              req = urllib.request.Request(url, headers={"Accept": "application/vnd.github+json", "User-Agent": "intuitik-prototype-guard"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      status = resp.status
                      body = resp.read()
              except urllib.error.HTTPError as e:
                  refuse(f"api-status status={e.code} url={url}")
              except Exception as e:
                  refuse(f"api-read error={type(e).__name__} url={url}")
              if status != 200:
                  refuse(f"api-status status={status} url={url}")
              try:
                  return json.loads(body)
              except Exception:
                  refuse(f"api-parse url={url}")

          def integer(value, what):
              if isinstance(value, bool) or not isinstance(value, int):
                  refuse(f"api-parse field={what}")
              return value

          def items_of(data, key, what):
              if not isinstance(data, dict) or not isinstance(data.get(key), list):
                  refuse(f"api-parse field={what}")
              return data[key]

          def has_marker(sha):
              if subprocess.run(["git", "cat-file", "-e", f"{sha}^{{commit}}"], capture_output=True).returncode != 0:
                  return True  # a commit absent locally is treated as containing the marker
              return subprocess.run(["git", "cat-file", "-e", f"{sha}:{MARKER}"], capture_output=True).returncode == 0

          # Where and when.
          if HEAD_REF != BRANCH:
              skip(f"branch={HEAD_REF}")
          if not os.path.isfile(MARKER):
              skip("marker=absent")
          if ATTEMPT != 1:
              skip(f"attempt={ATTEMPT}")

          # Size of this pack.
          pack = os.path.getsize(PACK)
          print(f"pack bytes={pack} limit={PACK_LIMIT}")
          if pack > PACK_LIMIT:
              refuse(f"pack-size bytes={pack} limit={PACK_LIMIT}")

          # (1) Live bytes: every unexpired artifact of the repository.
          live, read, page, total = 0, 0, 0, None
          while total is None or read < total:
              page += 1
              if page > 10:
                  refuse("artifact-pages pages>10")
              data = get(f"/repos/{REPO}/actions/artifacts", {"per_page": 100, "page": page})
              if total is None:
                  total = integer(data.get("total_count") if isinstance(data, dict) else None, "artifacts.total_count")
              items = items_of(data, "artifacts", "artifacts.artifacts")
              if not items and read < total:
                  refuse(f"artifact-list-short read={read} total_count={total}")
              for a in items:
                  if not isinstance(a, dict) or not isinstance(a.get("expired"), bool):
                      refuse("api-parse field=artifacts.expired")
                  size = integer(a.get("size_in_bytes"), "artifacts.size_in_bytes")
                  if a["expired"] is False:
                      live += size
              read += len(items)
          print(f"artifacts read={read} total_count={total} pages={page} live={live}")

          # (2) Earlier runs of this branch whose head has the marker: unknown uploads are reserved.
          runs, read, page, total = [], 0, 0, None
          while total is None or read < total:
              page += 1
              data = get(f"/repos/{REPO}/actions/workflows/ci.yml/runs", {"branch": BRANCH, "event": "pull_request", "per_page": 100, "page": page})
              if total is None:
                  total = integer(data.get("total_count") if isinstance(data, dict) else None, "branch-runs.total_count")
                  if total > 300:
                      refuse(f"branch-runs total_count={total} limit=300")
              items = items_of(data, "workflow_runs", "branch-runs.workflow_runs")
              if not items and read < total:
                  refuse(f"branch-runs-short read={read} total_count={total}")
              runs.extend(items)
              read += len(items)
          unknown, job_reads = 0, 0
          for r in runs:
              if not isinstance(r, dict):
                  refuse("api-parse field=branch-runs.item")
              rid = integer(r.get("id"), "branch-runs.id")
              sha = r.get("head_sha")
              if not isinstance(sha, str) or len(sha) != 40:
                  refuse("api-parse field=branch-runs.head_sha")
              if rid == RUN_ID or not has_marker(sha):
                  continue
              job_reads += 1
              if job_reads > 20:
                  refuse("job-reads reads>20")
              data = get(f"/repos/{REPO}/actions/runs/{rid}/attempts/1/jobs", {"per_page": 100})
              jobs = [j for j in items_of(data, "jobs", "jobs.jobs") if isinstance(j, dict) and j.get("name") == "prototype"]
              state = "no-attempt"
              if jobs:
                  steps = jobs[0].get("steps")
                  if steps is None:
                      steps = []
                  if not isinstance(steps, list):
                      refuse("api-parse field=jobs.steps")
                  begin = [s for s in steps if isinstance(s, dict) and s.get("name") == "upload begin"]
                  upload = [s for s in steps if isinstance(s, dict) and s.get("name") == "Upload prototype evidence"]
                  if not begin:
                      state = "no-attempt"
                  elif begin[0].get("status") != "completed":
                      state = "unknown"
                  elif begin[0].get("conclusion") == "skipped":
                      state = "no-attempt"
                  elif begin[0].get("conclusion") == "success" and upload and upload[0].get("status") == "completed" and upload[0].get("conclusion") == "success":
                      state = "known"
                  else:
                      state = "unknown"
              print(f"prior run={rid} head={sha} state={state}")
              if state == "unknown":
                  unknown += 1
                  print(f"prior-unknown reserved run={rid} bytes={RESERVE}")
          print(f"branch runs read={read} total_count={total} job-reads={job_reads} unknown={unknown}")

          # (3) No run of ci.yml numbered up to this run's number was deleted.
          data = get(f"/repos/{REPO}/actions/workflows/ci.yml/runs", {"per_page": 100})
          total = integer(data.get("total_count") if isinstance(data, dict) else None, "all-runs.total_count")
          items = items_of(data, "workflow_runs", "all-runs.workflow_runs")
          k = 0
          for r in items:
              if not isinstance(r, dict):
                  refuse("api-parse field=all-runs.item")
              if integer(r.get("run_number"), "all-runs.run_number") > RUN_NUMBER:
                  k += 1
          print(f"all runs total_count={total} newer={k} run_number={RUN_NUMBER}")
          if k >= 100:
              refuse(f"newer-runs k={k}")
          if total - k != RUN_NUMBER:
              refuse(f"run-deleted listed={total - k} run_number={RUN_NUMBER}")

          # Decision.
          print(f"artifact-bytes live={live} reserved={unknown}x{RESERVE} pack={pack} limit={LIMIT}")
          if live + RESERVE * unknown + pack > LIMIT:
              refuse(f"limit bytes={live + RESERVE * unknown + pack} limit={LIMIT}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("upload=yes\n")
          print("upload allowed")
          PY

      - name: upload begin
        if: steps.guard.outputs.upload == 'yes'
        run: echo "UPLOAD-BEGIN run=${GITHUB_RUN_ID}"

      - name: Upload prototype evidence
        if: steps.guard.outputs.upload == 'yes'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prototype-evidence-FA2-T8
          path: ${{ runner.temp }}/prototype-evidence.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: false
