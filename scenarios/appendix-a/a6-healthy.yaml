# FA2-T7b Appendix A A-6 healthy: PVC data, Deployment db mounting it (packet 3.2, 6.5).
apiVersion: v1
kind: Namespace
metadata:
  name: hk2-a6
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: hk2-a6
spec:
  storageClassName: standard
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: hk2-a6
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      terminationGracePeriodSeconds: 0
      containers:
        - name: db
          image: registry.k8s.io/pause:3.10@sha256:ee6521f290b2168b6e0935a181d4cff9be1ac3f505666ef0e3c98fae8199917a
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
