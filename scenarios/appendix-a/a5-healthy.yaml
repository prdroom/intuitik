# FA2-T7b Appendix A A-5 healthy: Deployment app with envFrom ConfigMap app-config (packet 3.2, 6.5).
apiVersion: v1
kind: Namespace
metadata:
  name: hk2-a5
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: hk2-a5
data:
  MODE: healthy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: hk2-a5
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      terminationGracePeriodSeconds: 0
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10@sha256:ee6521f290b2168b6e0935a181d4cff9be1ac3f505666ef0e3c98fae8199917a
          envFrom:
            - configMapRef:
                name: app-config
