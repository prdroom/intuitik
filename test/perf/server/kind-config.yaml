# kind cluster of job perf-server (packet FA2-T12 6.2, 6.3), created by TestPerfServer.
# Copied from the e2e-graph pattern (test/e2e-api/graph/kind-config.yaml), not shared.
# kind v0.33.0 generates kubeadm v1beta4 for Kubernetes v1.37 and applies a JSON 6902
# patch only to the document of the same group, version and kind, so these patches append
# to kind's own argument lists.
# - The API server writes an audit log (policy test/perf/server/audit-policy.yaml, copied
#   by the test to /tmp/intuitik-perf-audit/audit-policy.yaml on the runner) to
#   /var/log/kubernetes/audit/audit.log inside the node, in blocking mode (every event is
#   written before the response).
# - The API server compacts etcd every 30 s instead of every 5 minutes (DECISION
#   delegation T COMPACT-410-T12), so that a watch from resourceVersion 1 can end with
#   ERROR 410 (C6 row a). Every value of this harness is measured with this setting.
# - The controller manager's client may send 200 requests per second (burst 400) instead
#   of 20, so the ReplicaSets create the Pods of the L and XL clusters within the
#   readiness limits.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraMounts:
      - hostPath: /tmp/intuitik-perf-audit
        containerPath: /etc/kubernetes/intuitik-audit
        readOnly: true
kubeadmConfigPatchesJSON6902:
  - group: kubeadm.k8s.io
    version: v1beta4
    kind: ClusterConfiguration
    patch: |
      - op: add
        path: /apiServer/extraArgs/-
        value: {name: audit-policy-file, value: /etc/kubernetes/intuitik-audit/audit-policy.yaml}
      - op: add
        path: /apiServer/extraArgs/-
        value: {name: audit-log-path, value: /var/log/kubernetes/audit/audit.log}
      - op: add
        path: /apiServer/extraArgs/-
        value: {name: audit-log-mode, value: blocking}
      - op: add
        path: /apiServer/extraArgs/-
        value: {name: etcd-compaction-interval, value: 30s}
      - op: add
        path: /apiServer/extraVolumes
        value:
          - name: intuitik-audit-policy
            hostPath: /etc/kubernetes/intuitik-audit
            mountPath: /etc/kubernetes/intuitik-audit
            readOnly: true
            pathType: Directory
          - name: intuitik-audit-log
            hostPath: /var/log/kubernetes/audit
            mountPath: /var/log/kubernetes/audit
            readOnly: false
            pathType: DirectoryOrCreate
      - op: add
        path: /controllerManager/extraArgs/-
        value: {name: kube-api-qps, value: "200"}
      - op: add
        path: /controllerManager/extraArgs/-
        value: {name: kube-api-burst, value: "400"}
