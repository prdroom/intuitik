# Bridge fixtures of packet FA2-T6 phase (a) (E.6), applied with -n graph-bridges by
# test/e2e-api/graph/zz_bridges_kind_test.go. C1: Ingresses shop and plain. C2: Service api
# with a two-key selector and two ports, an ExternalName Service and a Service without
# selector, two Pods with both labels (Deployment api) and one with one label. C3: the
# StatefulSet db with a claim template, mounted read-write in a container and read-only in
# an init container; its Pod runs so the claim is bound. C5: HPAs api and w. The Pods of
# Deployment api and Pod api-other stay Pending (no node matches their node selector).
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: {app: api, tier: web}
  ports:
    - {name: http, port: 80, targetPort: 8080}
    - {name: dns, port: 53, targetPort: 53, protocol: UDP}
---
apiVersion: v1
kind: Service
metadata:
  name: ext
spec:
  type: ExternalName
  externalName: db.external.example
  selector: {app: api}
---
apiVersion: v1
kind: Service
metadata:
  name: nosel
spec:
  ports:
    - {port: 80}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop
spec:
  rules:
    - host: shop.local
      http:
        paths:
          - {path: /api, pathType: Prefix, backend: {service: {name: api, port: {number: 80}}}}
          - {path: /healthz, pathType: Exact, backend: {service: {name: api, port: {name: http}}}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: plain
spec:
  defaultBackend: {service: {name: api, port: {number: 80}}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector: {matchLabels: {app: api, tier: web}}
  template:
    metadata:
      labels: {app: api, tier: web}
    spec:
      nodeSelector: {intuitik.example/none: none}
      terminationGracePeriodSeconds: 0
      containers:
        - {name: c, image: registry.k8s.io/pause:3.10}
---
apiVersion: v1
kind: Pod
metadata:
  name: api-other
  labels: {app: api}
spec:
  nodeSelector: {intuitik.example/none: none}
  terminationGracePeriodSeconds: 0
  containers:
    - {name: c, image: registry.k8s.io/pause:3.10}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
spec:
  serviceName: db
  replicas: 1
  selector: {matchLabels: {app: db-bridges}}
  persistentVolumeClaimRetentionPolicy: {whenDeleted: Delete, whenScaled: Retain}
  template:
    metadata:
      labels: {app: db-bridges}
    spec:
      terminationGracePeriodSeconds: 0
      initContainers:
        - name: restore
          image: registry.k8s.io/pause:3.10
          volumeMounts:
            - {name: data, mountPath: /backup, readOnly: true}
      containers:
        - name: db
          image: registry.k8s.io/pause:3.10
          volumeMounts:
            - {name: data, mountPath: /var/lib/data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: standard
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 1Gi}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: api}
  minReplicas: 2
  maxReplicas: 5
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: w
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: StatefulSet, name: db}
  maxReplicas: 3
